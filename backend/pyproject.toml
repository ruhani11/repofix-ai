[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "repofix-ai-backend"
version = "0.1.0"
description = "Backend foundation for RepoFix AI"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115,<1",
    "pydantic-settings>=2,<3",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "openai-agents==0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"